<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

        <circle cx="50" cy="77" r="7" fill="#FFD166"/>

        <circle cx="50" cy="10" r="6" fill="#FFD166"/>
        <ellipse cx="18" cy="70" rx="8" ry="14" fill="#FF8F87" transform="rotate(-15 18 70)"/>
        <ellipse cx="82" cy="64" rx="8" ry="15" fill="#FF8F87" transform="rotate(20 82 64)"/>
        <circle cx="37" cy="55" r="10" fill="#fff"/>
        <circle cx="63" cy="55" r="10" fill="#fff"/>
        <path d="M34 52 L42 60 M42 52 L34 60" stroke="#33405F" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M60 52 L68 60 M68 52 L60 60" stroke="#33405F" stroke-width="2.4" stroke-linecap="round"/>

        <ellipse cx="62" cy="108" rx="9" ry="7" fill="#33405F"/>

      <p class="error-code" aria-hidden="true">404</p>
      <h1 style="font-size:clamp(24px,3.4vw,34px);">Oups, ce toboggan ne mène nulle part.</h1>
      <p>Même Urbo est perdu ! La page que vous cherchez n'existe pas ou a changé d'adresse. Revenez à l'accueil ou filez directement réserver vos billets.</p>
      <div class="error-actions">
        <a href="/index.html" class="btn btn-primary">Retour à l'accueil</a>
        <a href="/tarifs.html" class="btn btn-outline">Voir les tarifs</a>
      </div>
    </div>
  </section>
</main>
<footer>
  <div class="wrap">
    <div class="foot-bottom" style="border-top:none;padding-top:0;">
      <span>© <span data-year>2026</span> Urba Kids — Orbe, Suisse</span>
    </div>
